<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SignBridge - Deaf Intercom</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />

<!-- MediaPipe Holistic: REQUIRED for new Holistic(...) -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

<link rel="stylesheet" href="/static/CSS/style.css" />
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-icon">🤟</span>
    <span class="logo-text">SignBridge</span>
  </div>
  <div class="status-pill" id="statusPill">
    <span class="pulse-dot"></span>
    <span id="statusText">Connecting...</span>
  </div>
</header>

<div class="setup-panel" id="setupPanel">
  <h1 class="setup-title">Who are you?</h1>
  <p class="setup-sub">Choose your role to configure the right AI pipeline</p>

  <div class="role-cards">
    <button class="role-card" id="deafBtn" onclick="selectRole('deaf')">
      <span class="role-icon">🤟</span>
      <span class="role-label">Deaf User</span>
      <span class="role-desc">Sign Language -> Text via MediaPipe Holistic + AI</span>
    </button>

    <button class="role-card" id="normalBtn" onclick="selectRole('normal')">
      <span class="role-icon">🎙️</span>
      <span class="role-label">Normal User</span>
      <span class="role-desc">Speech -> Text via Vosk offline model</span>
    </button>
  </div>

  <div class="lang-row">
    <span class="lang-label">Language</span>
    <button class="lang-btn active" id="langEn" onclick="selectLang('en')">English</button>
    <button class="lang-btn" id="langHi" onclick="selectLang('hi')">Hindi</button>
  </div>

  <button class="start-btn" id="enterBtn" onclick="enterSession()" disabled>
    Enter Session ->
  </button>
</div>

<main class="session" id="session" style="display:none">
  <section class="video-area">
    <div class="video-wrap" id="localWrap">
      <video id="localVideo" autoplay muted playsinline></video>
      <canvas id="handCanvas"></canvas>
      <div class="video-label" id="localLabel">You</div>
      <div class="sign-badge" id="signBadge" style="display:none">🤟 Signing...</div>
    </div>

    <div class="divider-v">
      <div class="call-ring" id="callRing">
        <button class="call-btn green" id="startCallBtn" onclick="startCall()" title="Start Call">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </button>

        <button class="call-btn red" id="endCallBtn" onclick="endCall()" title="End Call" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </button>
      </div>
    </div>

    <div class="video-wrap remote-wrap">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Remote</div>
      <div class="no-remote" id="noRemote">Waiting for peer...</div>
    </div>
  </section>

  <div class="ctrl-bar">
    <div class="ctrl-group" id="signControls" style="display:none">
      <div class="ctrl-chip active" id="signChip">
        <span class="chip-dot green"></span>Sign Detection Active
      </div>
    </div>

    <div class="ctrl-group" id="speechControls" style="display:none">
      <button class="icon-btn mic" id="micBtn" onclick="toggleSpeech()">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM7 12a5 5 0 0 0 10 0M12 19v4M8 23h8"/></svg>
        <span>Start Mic</span>
      </button>
    </div>

    <div class="ctrl-group">
      <button class="icon-btn secondary" onclick="clearChat()">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        <span>Clear</span>
      </button>
    </div>
  </div>

  <section class="chat-section">
    <div class="chat-header">
      <span>Conversation</span>
      <span class="chat-mode" id="chatMode">-</span>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="chat-empty">Messages will appear here once the call starts...</div>
    </div>
  </section>
</main>

<script src="/static/JS/socket.js"></script>
<script src="/static/JS/webrtc.js"></script>
<script src="/static/JS/hand_tracking.js"></script>

</body>
</html>
